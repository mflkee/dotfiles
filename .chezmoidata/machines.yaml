machines:
  archlinux-mkair:
    wm: niri
    desktop: ""
    has_gsettings: false
    arch: x86_64
    browser: ""
    has_anaconda: false
    has_niri: true
    has_vpntel: true
    vpntel_proxy_if: wlo1
    vpntel_nas_host: "webdav.mkair.ru"
    vpntel_ssid: "GPNH-Guest"
    noctalia:
      wallhaven_query: ""
      network_view: "wifi"
      bluetooth_auto_connect: true
      has_arch_updater: false
      location_name: ""
  antix1:
    wm: ""
    desktop: xfce
    has_gsettings: false
    arch: i686
    browser: firefox
    has_anaconda: false
    has_niri: false
    noctalia:
      wallhaven_query: ""
      network_view: "wifi"
      bluetooth_auto_connect: true
      has_arch_updater: false
      location_name: ""
  archlinux-notebook:
    wm: niri
    desktop: gnome
    has_gsettings: true
    arch: x86_64
    browser: firefox
    has_anaconda: true
    has_niri: true
    has_vpntel: true
    vpntel_proxy_if: wlo1
    vpntel_nas_host: "webdav.mkair.ru"
    noctalia:
      wallhaven_query: "berserk"
      network_view: "ethernet"
      bluetooth_auto_connect: false
      has_arch_updater: false
      location_name: ""
    # Микрофон для hyprwhspr — внутренний Digital Microphone (Mic1).
    hyprwhspr_audio_device: "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source"
    # Watchdog локскрина ВЫКЛЮЧЕН (был true).
    #
    # Обход ставился для старого Noctalia r4541, который не рисовал
    # lockscreen schema-v2. На v5.2.1 локскрин рисуется нормально, а обход
    # стал причиной «коричневого экрана»: он считал нормальный лок (10 мин
    # простоя) заевшим и каждые 30 с перезапускал noctalia-shell, пока
    # сессия заблокирована. 2026-10-02 12:40-12:42 это закончилось тем, что
    # niri не смог перезапустить сессию («Failed to open session», os error 38),
    # экран остался пустым, помог только ребут.
    #
    # Если локскрин всё же залипнет — выход без ребута: Ctrl+Alt+Shift+U
    # (loginctl unlock-session) или Ctrl+Alt+Shift+L (рестарт оболочки).
    noctalia_lock_watchdog: false
  archlinux-desktop:
    wm: niri
    desktop: gnome
    has_gsettings: true
    arch: x86_64
    browser: firefox
    has_anaconda: false
    has_niri: true
    has_vpntel: true
    vpntel_proxy_if: wlo1
    vpntel_nas_host: "webdav.mkair.ru"
    # Микрофон для hyprwhspr (PipeWire source name). На десктопе default-source
    # — Focusrite Scarlett Solo с цифровой тишиной на входе, рабочий микрофон —
    # USB PnP Audio Device (JMTek 0c76:161e).
    hyprwhspr_audio_device: "alsa_input.usb-0c76_USB_PnP_Audio_Device-00.mono-fallback"
    noctalia:
      wallhaven_query: ""
      network_view: "wifi"
      bluetooth_auto_connect: true
      has_arch_updater: true
      location_name: "Tyumen"
  archlinux-server:
    wm: ""
    desktop: ""
    has_gsettings: false
    arch: x86_64
    browser: ""
    has_anaconda: false
    has_niri: false
    noctalia:
      wallhaven_query: ""
      network_view: "wifi"
      bluetooth_auto_connect: true
      has_arch_updater: false
      location_name: ""
  mkair-server-tmn:
    wm: ""
    desktop: ""
    has_gsettings: false
    arch: x86_64
    browser: ""
    has_anaconda: false
    has_niri: false
    noctalia:
      wallhaven_query: ""
      network_view: "wifi"
      bluetooth_auto_connect: true
      has_arch_updater: false
      location_name: ""
