appearance:
  theme:
    gtk: Adwaita
    gtk_prefer_dark: true
    qt: kvantum
    kvantum: KvGnomeDark
    color_scheme: prefer-dark
  icons:
    name: Tela-circle-dracula
    fallback: Adwaita
  fonts:
    main: "JetBrains Mono 11"
    monospace: "JetBrains Mono 11"
    document: "Noto Sans 11"
    window_title: "Noto Sans Bold 11"
  cursor:
    theme: Adwaita
    size: 24
  profiles:
    archlinux-notebook:
      niri:
        gaps: 14
        centerFocusedColumn: on-overflow
        borderWidth: 2
        borderActiveColor: '#70757d'
        borderInactiveColor: '#43484f'
        shadowSoftness: 56
        shadowSpread: 2
        shadowOffsetY: 8
        shadowColor: '#00000028'
        cornerRadius: 8
    archlinux-desktop:
      niri:
        gaps: 14
        centerFocusedColumn: on-overflow
        borderWidth: 2
        borderActiveColor: '#70757d'
        borderInactiveColor: '#43484f'
        shadowSoftness: 56
        shadowSpread: 2
        shadowOffsetY: 8
        shadowColor: '#00000028'
        cornerRadius: 8
