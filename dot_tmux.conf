set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g default-shell '/bin/zsh'

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
unbind C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# Новые окна и панели открывать из директории активной панели
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Изменение размера панелей с префиксом
bind-key -r C-Up resize-pane -U 2
bind-key -r C-Down resize-pane -D 2
bind-key -r C-Left resize-pane -L 5
bind-key -r C-Right resize-pane -R 5

# Переименование окон
bind-key , command-prompt "rename-window %%"

# Полноэкранный режим панели
bind-key z resize-pane -Z

# Синхронный ввод во все панели
bind D setw synchronize-panes

# Отсоединение от tmux-сессии
bind d detach-client

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"

set -g allow-passthrough on
if-shell -b 'test -f ~/.config/dsync/tmux-theme.conf' 'source-file ~/.config/dsync/tmux-theme.conf'

# ── Plugins (managed by tmuxpanel) ──────────────────────
set -g @plugin 'tmux-plugins/tmux-sensible'
run-shell '~/.tmux/plugins/tmux-sensible/sensible.tmux'
set -g @plugin 'tmux-plugins/tmux-continuum'
run-shell '~/.tmux/plugins/tmux-continuum/continuum.tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
run-shell '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
run-shell '~/.tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux'
set -g @plugin 'mflkee/tokyo-night-tmux'
run-shell '~/.tmux/plugins/tokyo-night-tmux/tokyo-night.tmux'
# ── End plugins ──────────────────────────────────────

# ── Монохромная тема (black & white) ────────────────
set -g status-interval 15
set -g status-style "bg=black,fg=white"
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[bg=white,fg=black,bold] #{?client_prefix, PREFIX , #S }"
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[fg=brightblack]%a %d.%m #[bg=white,fg=black,bold] %H:%M "
set -g window-status-separator " "
set -g window-status-style "bg=black,fg=brightblack"
set -g window-status-format " #I:#W "
set -g window-status-current-style "bg=white,fg=black,bold"
set -g window-status-current-format " #I:#W "
set -g window-status-activity-style "bg=black,fg=white"
set -g window-status-bell-style "bg=white,fg=black,bold"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=white"
set -g message-style "bg=white,fg=black"
set -g message-command-style "bg=black,fg=white"
set -g mode-style "bg=white,fg=black"
