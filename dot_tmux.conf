set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g default-shell '/bin/zsh'

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
unbind C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# Новые окна и панели открывать из директории активной панели
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Изменение размера панелей с префиксом
bind-key -r C-Up resize-pane -U 2
bind-key -r C-Down resize-pane -D 2
bind-key -r C-Left resize-pane -L 5
bind-key -r C-Right resize-pane -R 5

# Переименование окон
bind-key , command-prompt "rename-window %%"

# Полноэкранный режим панели
bind-key z resize-pane -Z

# Синхронный ввод во все панели
bind D setw synchronize-panes

# Отсоединение от tmux-сессии
bind d detach-client

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"

set -g allow-passthrough on

# Hacker style status bar in truecolor: kitty's noctalia palette remaps ANSI
# colors (green -> gray #cccccc), so named colors render wrong
set -g status-style 'bg=#000000,fg=#00ff00'

# Hacker green UI: messages, command line, copy mode, panes, popups
set -g mode-style 'fg=#00ff00,bg=#0d1f0d'
set -g copy-mode-match-style 'fg=#00ff00,bg=#0d1f0d'
set -g copy-mode-current-match-style 'fg=#000000,bg=#00ff00'
set -g message-style 'fg=#00ff00,bg=#000000'
set -g message-command-style 'fg=#00ff00,bg=#000000'
set -g pane-border-style 'fg=#0d1f0d'
set -g pane-active-border-style 'fg=#00ff00'
set -g popup-style 'bg=#000000,fg=#00ff00'
set -g popup-border-style 'fg=#00ff00'

run '~/.tmux/plugins/tpm/tpm'

# ── Cross-machine session sync (snapshots travel via ~/buffer Syncthing folder) ──
bind-key E run-shell "tmux-export-buffer"
bind-key R run-shell "tmux-import-buffer"
