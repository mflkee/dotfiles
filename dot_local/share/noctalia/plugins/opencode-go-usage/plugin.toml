# OpenCode Go plan limits in the Noctalia bar.
#
# Data source: GET https://opencode.ai/console/api/go/status - the same oRPC
# endpoint the web dashboard calls, so no HTML scraping. Meters are spend caps
# in micro-cents; the widget shows used/limit for each (rolling 5h / weekly /
# monthly).
#
# v1.2: аккаунты A/B. Активный аккаунт читается из
#   ~/.config/opencode-go/current
# Токены аккаунтов лежат в:
#   ~/.config/opencode-go/accounts/<name>.json   (0600; создаёт opencode-go-auth)
#   ~/.config/opencode-go/credentials.json       (копия активного для виджета)
# Клик по виджету = переключение аккаунта (`opencode-go-auth use <next>`).
# Продюсер токенов: `opencode-go-auth login --account <a|b>` (device flow).

id = "mflkee/opencode-go-usage"
name = "OpenCode Go Usage"
version = "1.2.0"
plugin_api = 3
author = "mflkee"
license = "MIT"
dependencies = []
icon = "gauge"
description = "Показывает лимиты OpenCode Go (rolling 5h / weekly / monthly) и переключает аккаунты A/B."
tags = ["productivity", "ai"]

[[widget]]
id = "usage"
entry = "usage.luau"

  [[widget.setting]]
  key = "label"
  type = "string"
  label_key = "settings.label.label"
  description_key = "settings.label.description"
  default = "OC"
  advanced = true

  [[widget.setting]]
  key = "display"
  type = "select"
  label_key = "settings.display.label"
  description_key = "settings.display.description"
  default = "worst"
    options = [
      { value = "worst", label_key = "settings.display.option.worst" },
      { value = "all", label_key = "settings.display.option.all" },
    ]

  [[widget.setting]]
  key = "refresh_minutes"
  type = "int"
  label_key = "settings.refresh_minutes.label"
  description_key = "settings.refresh_minutes.description"
  default = 5
  min = 1
  max = 120
  step = 1

  [[widget.setting]]
  key = "credentials_file"
  type = "string"
  label_key = "settings.credentials_file.label"
  description_key = "settings.credentials_file.description"
  default = "~/.config/opencode-go/credentials.json"
  advanced = true

  [[widget.setting]]
  key = "click_action"
  type = "select"
  label_key = "settings.click_action.label"
  description_key = "settings.click_action.description"
  default = "switch"
    options = [
      { value = "switch", label_key = "settings.click_action.option.switch" },
      { value = "refresh", label_key = "settings.click_action.option.refresh" },
    ]

  [[widget.setting]]
  key = "show_account"
  type = "toggle"
  label_key = "settings.show_account.label"
  description_key = "settings.show_account.description"
  default = true