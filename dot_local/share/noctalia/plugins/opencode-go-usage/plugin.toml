# OpenCode Go plan limits in the Noctalia bar.
#
# Data source: the Go dashboard page https://opencode.ai/workspace/<id>/go.
# OpenCode publishes no API for plan limits, so the widget scrapes the
# server-rendered `data-slot="usage"` block - the same three numbers the web UI
# shows (rolling / weekly / monthly).
#
# Credentials (workspace id + the browser `auth` cookie) are read from a 0600
# JSON file instead of Noctalia settings, so the token never lands in
# settings.toml (which is world-readable):
#   {"workspace_id": "...", "token": "..."}
# Default location: ~/.config/opencode-go/credentials.json

id = "mflkee/opencode-go-usage"
name = "OpenCode Go Usage"
version = "1.0.0"
plugin_api = 3
author = "mflkee"
license = "MIT"
dependencies = []
icon = "gauge"
description = "Показывает лимиты OpenCode Go (rolling 5h / weekly / monthly) в баре."
tags = ["productivity", "ai"]

[[widget]]
id = "usage"
entry = "usage.luau"

  [[widget.setting]]
  key = "label"
  type = "string"
  label_key = "settings.label.label"
  description_key = "settings.label.description"
  default = "OC"
  advanced = true

  [[widget.setting]]
  key = "display"
  type = "select"
  label_key = "settings.display.label"
  description_key = "settings.display.description"
  default = "worst"
    options = [
      { value = "worst", label_key = "settings.display.option.worst" },
      { value = "all", label_key = "settings.display.option.all" },
    ]

  [[widget.setting]]
  key = "refresh_minutes"
  type = "int"
  label_key = "settings.refresh_minutes.label"
  description_key = "settings.refresh_minutes.description"
  default = 5
  min = 1
  max = 120
  step = 1

  [[widget.setting]]
  key = "credentials_file"
  type = "string"
  label_key = "settings.credentials_file.label"
  description_key = "settings.credentials_file.description"
  default = "~/.config/opencode-go/credentials.json"
