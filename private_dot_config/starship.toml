format = """
$time\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"
vimcmd_symbol = "[\\$](bold yellow)"

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[ $user]($style)"

[hostname]
ssh_only = false
style = "dimmed white"
format = "[@$hostname]($style) "

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = false
read_only = " ro"
format = "[in $path]($style)[$read_only](bold red) "

[git_branch]
symbol = "git:"
style = "bold purple"
format = "[on $symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style)) "

[cmd_duration]
min_time = 500
style = "yellow"
format = "[took $duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "dimmed white"
format = "[$time]($style) "

[nodejs]
symbol = "node "
style = "bold green"
format = "[via $symbol($version )]($style)"

[python]
symbol = "py "
style = "bold yellow"
format = "[via $symbol$version( \\($virtualenv\\))]($style)"

[rust]
symbol = "rs "
style = "bold red"
format = "[via $symbol$version]($style)"

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = true
