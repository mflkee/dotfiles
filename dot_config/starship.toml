"$schema" = 'https://starship.rs/config-schema.json'

# Cyberpunk theme based on Noctalia Cyberpunk palette
# Palette: bg=#0c1017, gold=#c4a82e, red=#d14358, green=#00a66c
#          cyan=#45a0d6, blue=#5c8ac4, purple=#9b6bc1

format = """
[░▒▓](bg:#0c1017 fg:#45a0d6)\
[ 󰣇 ](bg:#45a0d6 fg:#0c1017)\
[](bg:#11151d fg:#45a0d6)\
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$python\
$cmd_duration\
[ ](fg:#0c1017)\
\n$character"""

palette = "cyberpunk"

[palettes.cyberpunk]
# Core
cyber_bg = "#0c1017"
cyber_bg_alt = "#11151d"
cyber_bg_light = "#1a1f2e"
cyber_fg = "#e0e0e0"
# Neon accents
cyber_gold = "#c4a82e"
cyber_red = "#d14358"
cyber_green = "#00a66c"
cyber_cyan = "#45a0d6"
cyber_blue = "#5c8ac4"
cyber_purple = "#9b6bc1"
cyber_orange = "#ff8800"

[character]
success_symbol = "[➜](bold fg:#00a66c)"
error_symbol = "[✗](bold fg:#d14358)"
vimcmd_symbol = "[➜](bold fg:#c4a82e)"

[directory]
style = "fg:#e0e0e0 bg:#11151d"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " "
read_only_style = "fg:#d14358"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"projects" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:#45a0d6"
format = "[](fg:#11151d bg:#1a1f2e)[ $symbol $branch ]($style)"

[git_status]
style = "fg:#d14358"
format = "[($all_status$ahead_behind )]($style)"
conflicted = "${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nodejs]
symbol = ""
style = "fg:#00a66c"
format = "[](fg:#1a1f2e bg:#0c1017)[ $symbol($version) ]($style)"

[python]
symbol = ""
style = "fg:#c4a82e"
format = "[](fg:#1a1f2e bg:#0c1017)[ $symbol($version) ]($style)"

[rust]
symbol = ""
style = "fg:#ff8800"
format = "[](fg:#1a1f2e bg:#0c1017)[ $symbol($version) ]($style)"

[cmd_duration]
min_time = 1000
style = "fg:#9b6bc1"
format = "[](fg:#1a1f2e bg:#0c1017)[ $duration]($style)"

[time]
disabled = true

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = true
