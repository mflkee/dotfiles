# Auto-generated by dsync from Noctalia colors
# Do not edit manually — it will be overwritten on next sync

palette = "noctalia"

[palettes.noctalia]
primary = "#7aa2f7"
secondary = "#bb9af7"
tertiary = "#9ece6a"
error = "#f7768e"
surface = "#1a1b26"
on_surface = "#c0caf5"
surface_variant = "#24283b"
on_surface_variant = "#9aa5ce"

[character]
success_symbol = "[>](bold primary)"
error_symbol = "[>](bold error)"
vicmd_symbol = "[<](bold secondary)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold primary"

[git_branch]
style = "bold #bb9af7"
symbol = " "

[git_status]
style = "error"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${count}"
conflicted = "=${count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
stashed = "\$${count}"

[cmd_duration]
style = "on_surface_variant"
format = " took [$duration]($style) "

[status]
style = "error"
symbol = "✘"
success_symbol = ""
format = "[$symbol$common_meaning$signal_name$maybe_int]($style) "
map_symbol = true
disabled = false

[time]
style = "on_surface_variant"
format = "[$time]($style) "
disabled = true

[username]
show_always = false
disabled = true

[hostname]
ssh_only = true
style = "secondary"
disabled = false
