palette = "hacker"
format = """
$username\
$hostname \
$directory\
\n$character"""

[character]
success_symbol = "[＄](bold #00ff41)"
error_symbol = "[＄](bold #ff5f56)"
vimcmd_symbol = "[＄](bold #ffd75f)"

[username]
disabled = false
style_user = "bold #4be3c3"

[hostname]
disabled = false
style = "bold #4be3c3"
format = "@[$hostname](bold #4be3c3)"

[directory]
truncation_length = 3
truncate_to_repo = false
style = "bold #58a6ff"

[kubernetes]
disabled = true

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[git_branch]
disabled = true

[git_status]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[cmd_duration]
disabled = true

[time]
disabled = true

# >>> HACKER PALETTE >>>
# Matrix green on black; hues kept distinct for readability
[palettes.hacker]
green     = "#00ff41"
red       = "#ff5f56"
yellow    = "#ffd75f"
blue      = "#58a6ff"
cyan      = "#4be3c3"
magenta   = "#ff79c6"
white     = "#b8e6c0"
black     = "#101510"

# Extended palette names
rosewater = "#ffa3dd"
flamingo  = "#ff79c6"
pink      = "#ff79c6"
mauve     = "#b48cff"
maroon    = "#ff5f56"
peach     = "#ffb86c"
teal      = "#4be3c3"
sky       = "#79c0ff"
sapphire  = "#58a6ff"
lavender  = "#b48cff"

# Text shades
text      = "#00ff41"
subtext1  = "#9fe8b0"
subtext0  = "#5a8a68"

# Surface shades
overlay2  = "#2e4032"
overlay1  = "#243428"
overlay0  = "#1a2a1e"
surface2  = "#14221a"
surface1  = "#101510"
surface0  = "#0d120f"
base      = "#000000"
mantle    = "#000000"
crust     = "#000000"
# <<< HACKER PALETTE <<<
