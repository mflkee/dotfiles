format = """
$username\
$hostname\
$directory\
\n$character"""

[character]
success_symbol = "[＄](bold green)"
error_symbol = "[＄](bold red)"
vimcmd_symbol = "[＄](bold yellow)"

[username]
disabled = false
style_user = "bold cyan"

[hostname]
disabled = false
style = "bold cyan"
format = "@[$hostname](bold cyan)"

[directory]
truncation_length = 3
truncate_to_repo = false
style = "bold cyan"

[kubernetes]
disabled = true

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[git_branch]
disabled = true

[git_status]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[cmd_duration]
disabled = true

[time]
disabled = true
