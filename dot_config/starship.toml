palette = "noctalia"
format = '''
[┌──\(](#828282)$username[](#1793d1)$hostname[\)-\[](#828282)$directory[\]](#828282)
[└─](#828282)$character'''

[character]
success_symbol = "[$](#1793d1)"
error_symbol = "[$](#ff5555)"
vimcmd_symbol = "[$](#aaaaaa)"

[username]
show_always = true
style_user = "#cccccc"
format = "[$user](#cccccc)"

[hostname]
ssh_only = false
style = "#cccccc"
format = "[$hostname](#cccccc)"

[directory]
truncation_length = 3
truncate_to_repo = false
style = "#dddddd"
format = "[$path](#dddddd)"

