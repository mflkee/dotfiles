format = """
$username\
$hostname\
$directory\
\n$character"""

[character]
success_symbol = "[＄](bold #7aa2f7)"
error_symbol = "[＄](bold #f7768e)"
vimcmd_symbol = "[＄](bold #e0af68)"

[username]
disabled = false
style_user = "bold #7dcfff"

[hostname]
disabled = false
style = "bold #7dcfff"
format = "@[$hostname](bold #7dcfff)"

[directory]
truncation_length = 3
truncate_to_repo = false
style = "bold #7dcfff"

[kubernetes]
disabled = true

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[git_branch]
disabled = true

[git_status]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[cmd_duration]
disabled = true

[time]
disabled = true
