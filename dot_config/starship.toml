palette = "noctalia"
format = """
$username\
$hostname \
$directory\
\n$character"""

[character]
success_symbol = "[＄](bold #dddddd)"
error_symbol = "[＄](bold #ff5555)"
vimcmd_symbol = "[＄](bold #aaaaaa)"

[username]
disabled = false
style_user = "bold #aaaaaa"

[hostname]
disabled = false
style = "bold #aaaaaa"
format = "@[$hostname](bold #aaaaaa)"

[directory]
truncation_length = 3
truncate_to_repo = false
style = "bold #dddddd"

[kubernetes]
disabled = true

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[git_branch]
disabled = true

[git_status]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[cmd_duration]
disabled = true

[time]
disabled = true

