[mgr]
ratio = [1, 2, 3]
sort_by = "natural"
sort_dir_first = true
linemode = "size"
show_hidden = false

[preview]
tab_size = 2
max_width = 1200
max_height = 1800

# yazi 26: [opener] — это ТОЛЬКО определения именованных опенеров.
# Какой опенер для каких файлов — задаётся в [open] через use = "имя".
[opener]
edit = [
	{ run = "${EDITOR:-vi} %s", desc = "$EDITOR", block = true, for = "unix" },
]
zathura = [
	{ run = "zathura %s", desc = "Zathura (PDF)", orphan = true },
]
libreoffice = [
	{ run = "libreoffice %s", desc = "LibreOffice", orphan = true },
]

# prepend_rules вставляются ПЕРЕД встроенными правилами yazi, поэтому папки,
# архивы, картинки и видео продолжают открываться дефолтными опенерами.
[open]
prepend_rules = [
	# text & code → редактор (блокирующе, работает на любой машине)
	{ mime = "text/*", use = "edit" },
	{ url = "*.json", use = "edit" },
	{ url = "*.jsonc", use = "edit" },
	{ url = "*.yaml", use = "edit" },
	{ url = "*.yml", use = "edit" },
	{ url = "*.toml", use = "edit" },
	{ url = "*.xml", use = "edit" },

	# pdf → zathura
	{ mime = "application/pdf", use = "zathura" },
	{ url = "*.pdf", use = "zathura" },

	# office → libreoffice
	{ mime = "application/msword", use = "libreoffice" },
	{ mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document", use = "libreoffice" },
	{ mime = "application/vnd.ms-excel", use = "libreoffice" },
	{ mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", use = "libreoffice" },
	{ mime = "application/vnd.ms-powerpoint", use = "libreoffice" },
	{ mime = "application/vnd.openxmlformats-officedocument.presentationml.presentation", use = "libreoffice" },
	{ mime = "application/vnd.oasis.opendocument.text", use = "libreoffice" },
	{ mime = "application/vnd.oasis.opendocument.spreadsheet", use = "libreoffice" },
	{ mime = "application/vnd.oasis.opendocument.presentation", use = "libreoffice" },
	{ mime = "application/rtf", use = "libreoffice" },
	{ url = "*.doc", use = "libreoffice" },
	{ url = "*.docx", use = "libreoffice" },
	{ url = "*.xls", use = "libreoffice" },
	{ url = "*.xlsx", use = "libreoffice" },
	{ url = "*.ppt", use = "libreoffice" },
	{ url = "*.pptx", use = "libreoffice" },
	{ url = "*.odt", use = "libreoffice" },
	{ url = "*.ods", use = "libreoffice" },
	{ url = "*.odp", use = "libreoffice" },
	{ url = "*.rtf", use = "libreoffice" },
]
