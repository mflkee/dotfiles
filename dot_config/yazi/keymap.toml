[mgr]
keymap = [
	{ on = "<Esc>", run = "escape", desc = "Cancel" },
	{ on = "q", run = "quit", desc = "Quit" },
	{ on = "Q", run = "quit --no-cwd-file", desc = "Quit without cwd" },
	{ on = "<C-c>", run = "close", desc = "Close tab" },

	{ on = "k", run = "arrow prev", desc = "Up" },
	{ on = "j", run = "arrow next", desc = "Down" },
	{ on = "<Up>", run = "arrow prev", desc = "Up" },
	{ on = "<Down>", run = "arrow next", desc = "Down" },
	{ on = "<C-u>", run = "arrow -50%", desc = "Half page up" },
	{ on = "<C-d>", run = "arrow 50%", desc = "Half page down" },

	{ on = "h", run = "leave", desc = "Parent dir" },
	{ on = "l", run = "enter", desc = "Enter" },
	{ on = "<Left>", run = "leave", desc = "Parent dir" },
	{ on = "<Right>", run = "enter", desc = "Enter" },
	{ on = "H", run = "back", desc = "Back" },
	{ on = "L", run = "forward", desc = "Forward" },

	{ on = "<Enter>", run = "plugin smart-enter", desc = "Smart enter" },
	{ on = "<S-Enter>", run = "open --interactive", desc = "Open interactive" },

	{ on = "y", run = "yank", desc = "Yank" },
	{ on = "x", run = "yank --cut", desc = "Cut" },
	{ on = "p", run = "paste", desc = "Paste" },
	{ on = "P", run = "paste --force", desc = "Paste force" },
	{ on = "d", run = "plugin dt", desc = "Move to trash (dt)" },
	{ on = "D", run = "remove --permanently", desc = "Delete permanently" },
	{ on = "a", run = "create", desc = "Create" },
	{ on = "r", run = "rename --cursor=before_ext", desc = "Rename" },
	{ on = ".", run = "hidden toggle", desc = "Hidden toggle" },
	{ on = "v", run = "visual_mode", desc = "Visual mode" },
	{ on = "V", run = "visual_mode --unset", desc = "Visual unset" },
	{ on = "<Space>", run = [ "toggle", "arrow 1" ], desc = "Toggle select" },
	{ on = "<C-a>", run = "toggle_all --state=on", desc = "Select all" },
	{ on = "<C-r>", run = "toggle_all", desc = "Invert all" },

	{ on = "Y", run = "shell -- $HOME/.config/yazi/copy-clip.sh %h", desc = "Copy to clipboard" },

	{ on = "o", run = "open", desc = "Open" },
	{ on = "O", run = "open --interactive", desc = "Open interactive" },

	{ on = "s", run = "search --via=fd", desc = "Search name" },
	{ on = "S", run = "search --via=rg", desc = "Search content" },
	{ on = "/", run = "find --smart", desc = "Find" },
	{ on = "n", run = "find_arrow", desc = "Next found" },
	{ on = "N", run = "find_arrow --previous", desc = "Prev found" },
	{ on = "f", run = "filter --smart", desc = "Filter" },

	{ on = "t", run = "tab_create --current", desc = "New tab" },
	{ on = "1", run = "tab_switch 0", desc = "Tab 1" },
	{ on = "2", run = "tab_switch 1", desc = "Tab 2" },
	{ on = "3", run = "tab_switch 2", desc = "Tab 3" },
	{ on = "4", run = "tab_switch 3", desc = "Tab 4" },
	{ on = "5", run = "tab_switch 4", desc = "Tab 5" },
	{ on = "6", run = "tab_switch 5", desc = "Tab 6" },
	{ on = "7", run = "tab_switch 6", desc = "Tab 7" },
	{ on = "8", run = "tab_switch 7", desc = "Tab 8" },
	{ on = "9", run = "tab_switch 8", desc = "Tab 9" },
	{ on = "[", run = "tab_switch -1 --relative", desc = "Prev tab" },
	{ on = "]", run = "tab_switch 1 --relative", desc = "Next tab" },
	{ on = "w", run = "tasks:show", desc = "Tasks" },

	{ on = "~", run = "help", desc = "Help" },
	{ on = "G", run = "arrow bot", desc = "Bottom" },
	{ on = "z", run = "plugin fzf", desc = "Fzf" },
	{ on = "Z", run = "plugin zoxide", desc = "Zoxide" },
]
