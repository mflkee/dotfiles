# Cyberpunk flavor for Yazi
# Based on Noctalia Cyberpunk palette

[manager]
cwd = { fg = "#c4a82e" }
# Hovered
hovered         = { fg = "#0c1017", bg = "#45a0d6", bold = true }
preview_hovered = { underline = true }
# Find
find_keyword  = { fg = "#0c1017", bg = "#c4a82e", bold = true, italic = true }
find_position = { fg = "#9b6bc1", bg = "#0c1017", bold = true }
# Marker
marker_copied   = { fg = "#00a66c", bg = "#00a66c" }
marker_cut      = { fg = "#d14358", bg = "#d14358" }
marker_marked   = { fg = "#9b6bc1", bg = "#9b6bc1" }
marker_selected = { fg = "#c4a82e", bg = "#c4a82e" }
# Tab
tab_active   = { fg = "#0c1017", bg = "#45a0d6" }
tab_inactive = { fg = "#e0e0e0", bg = "#1a1f2e" }
# Count
count_copied   = { fg = "#0c1017", bg = "#00a66c" }
count_cut      = { fg = "#0c1017", bg = "#d14358" }
count_selected = { fg = "#0c1017", bg = "#c4a82e" }
# Border
border_symbol = "│"
border_style  = { fg = "#45a0d6" }

[mode]
normal_main = { fg = "#0c1017", bg = "#45a0d6", bold = true }
normal_alt  = { fg = "#45a0d6", bg = "#1a1f2e" }
select_main = { fg = "#0c1017", bg = "#9b6bc1", bold = true }
select_alt  = { fg = "#9b6bc1", bg = "#1a1f2e" }
unset_main  = { fg = "#0c1017", bg = "#d14358", bold = true }
unset_alt   = { fg = "#d14358", bg = "#1a1f2e" }

[which]
mask            = { bg = "#090d13" }
cand            = { fg = "#5c8ac4" }
rest            = { fg = "#2a3a4e" }
desc            = { fg = "#9b6bc1" }
separator       = "  "
separator_style = { fg = "#1a1f2e" }

[confirm]
border  = { fg = "#45a0d6" }
title   = { fg = "#45a0d6" }
content = {}
list    = {}
btn_yes = { fg = "#00a66c" }
btn_no  = { fg = "#d14358" }
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#45a0d6" }
title  = { fg = "#c4a82e" }

[input]
border   = { fg = "#45a0d6" }
title    = {}
value    = {}
selected = { reversed = true }

[completion]
border   = { fg = "#45a0d6" }
title    = { fg = "#c4a82e" }
icon     = { fg = "#c4a82e" }

[help]
on      = { fg = "#d14358" }
run     = { fg = "#45a0d6" }
desc    = { fg = "#9b6bc1" }
hovered = { bg = "#1a1f2e", bold = true }
footer  = { fg = "#0c1017", bg = "#45a0d6" }

[notify]
title_info  = { fg = "#45a0d6" }
title_warn  = { fg = "#c4a82e" }
title_error = { fg = "#d14358" }

[pick]
border = { fg = "#45a0d6" }
active = { fg = "#00a66c" }
inactive = {}

[task]
title  = { fg = "#45a0d6" }
border = { fg = "#1a1f2e" }
hovered = { fg = "#e0e0e0", bg="#1a1f2e" }

# File-specific styles
[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#9b6bc1" },
  # Videos
  { mime = "video/*", fg = "#c4a82e" },
  { mime = "audio/*", fg = "#c4a82e" },
  # Archives
  { mime = "application/zip", fg = "#d14358" },
  { mime = "application/gzip", fg = "#d14358" },
  { mime = "application/x-tar", fg = "#d14358" },
  { mime = "application/x-bzip", fg = "#d14358" },
  { mime = "application/x-bzip2", fg = "#d14358" },
  { mime = "application/x-7z-compressed", fg = "#d14358" },
  { mime = "application/x-rar", fg = "#d14358" },
  { mime = "application/xz", fg = "#d14358" },
  # Documents
  { mime = "application/doc", fg = "#45a0d6" },
  { mime = "application/pdf", fg = "#d14358" },
  { mime = "application/rtf", fg = "#45a0d6" },
  { mime = "application/vnd.*", fg = "#45a0d6" },
  # Fallback
  { mime = "*", fg = "#e0e0e0" },
  { mime = "inode/directory", fg = "#45a0d6" }
]

[icon]
prepend_dirs = [
  { name = "*/", text = "📁" },
]
