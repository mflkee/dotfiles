[preferred]
# default=gnome даёт ScreenCast/RemoteDesktop (нужно niri для записи ОКНА и шаринга
# экрана в OBS/браузере).
# FileChooser=gnome — диалог выбора файла открывается как Nautilus (GTK4: сетка,
# хлебные крошки, боковая панель), а не аскетичный список gtk-портала.
default=gnome
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.FileChooser=gnome
org.freedesktop.impl.portal.AppChooser=gtk
