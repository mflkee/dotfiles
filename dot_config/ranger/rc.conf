# Load ranger defaults first, then override only the local behavior.

set preview_script ~/.config/ranger/scope.sh
set use_preview_script true
set preview_files true
set preview_directories true
set collapse_preview true
set wrap_plaintext_previews true
set preview_max_size 10485760

# Text previews are always safe. Real image previews can be toggled with zi.
# Ghostty can use the kitty graphics protocol, but tmux may not pass it through.
set preview_images false
set preview_images_method kitty

set colorscheme aura
set draw_borders separators
set column_ratios 1,3,4
set unicode_ellipsis true
set show_selection_in_titlebar true
set tilde_in_titlebar true
set update_title true
set update_tmux_title true

set vcs_aware true
set vcs_backend_git enabled
set sort natural
set sort_case_insensitive true
set sort_directories_first true
set open_all_images true
set mouse_enabled true
set confirm_on_delete multiple
set save_tabs_on_exit true
set display_size_in_main_column true
set display_size_in_status_bar true
set display_free_space_in_status_bar true

# Safer delete workflow: regular delete keys go to trash, permanent delete is
# still available explicitly through dX.
map DD console trash
map dD console trash
map dX console delete
map <DELETE> console trash
map <F8> console trash

# File-manager style shortcuts around the existing vim-like defaults.
map e edit
map E edit
map x shell -w xdg-open %s
map X chain draw_possible_programs; console open_with%space
map yp yank path
map yd yank dir
map yn yank name
map y. yank name_without_extension

# Frequent places.
map gD cd ~/Downloads
map gc cd ~/.config
map gC cd ~/dotfiles
map gp cd ~/projects
map gb cd ~/bin
map gl cd ~/.local
map gm cd /media
map gr cd /

# Preview and layout toggles.
map zi set preview_images!
map zp set preview_files!
map zP set preview_directories!
map zb console set draw_borders%space
map zc set collapse_preview!
map zh set show_hidden!
map <C-h> set show_hidden!

# Sorting mnemonics.
map om chain set sort=mtime; set sort_reverse=True
map on chain set sort=natural; set sort_reverse=False
map os chain set sort=size; set sort_reverse=True
map ot chain set sort=type; set sort_reverse=False

# Tabs and tasks keep their defaults; add a couple of discoverable aliases.
alias open open_with open
alias nvim open_with editor
