# vim: ft=cfg
#
# Focused opener rules for the local desktop stack:
# nvim for text, zathura for PDFs, image/video apps when present, and xdg-open
# as the final desktop fallback.

# Directories
directory, has ranger = ranger -- "$1"

# Web documents
ext x?html?|svg, has zen-browser, X, flag f = zen-browser -- "$@"
ext x?html?|svg, has xdg-open, X, flag f = xdg-open -- "$@"

# Text, code and structured text
mime ^text, label editor = nvim -- "$@"
!mime ^text, ext xml|json|jsonc|jsonl|yaml|yml|toml|ini|csv|tsv|md|markdown|rst|tex|py|lua|js|jsx|ts|tsx|sh|bash|zsh|fish|rs|go|c|h|cpp|hpp|java|kt|rb|php|sql|kdl|tmpl|conf|service|desktop = nvim -- "$@"
mime ^text, label pager = ${PAGER:-less -R} -- "$@"

# Documents
ext pdf, has zathura, X, flag f = zathura -- "$@"
ext pdf, has xdg-open, X, flag f = xdg-open -- "$@"
ext djvu|epub|cbz|cbr, has zathura, X, flag f = zathura -- "$@"
ext odt|ods|odp|docx?|xlsx?|pptx?, has libreoffice, X, flag f = libreoffice -- "$@"

# Images
mime ^image, has imv, X, flag f = imv -- "$@"
mime ^image, has nsxiv, X, flag f = nsxiv -- "$@"
mime ^image, has sxiv, X, flag f = sxiv -- "$@"
mime ^image, has xdg-open, X, flag f = xdg-open -- "$@"

# Video and audio
mime ^video, has mpv, X, flag f = mpv -- "$@"
mime ^audio, has mpv, X, flag f = mpv -- "$@"
mime ^video|audio, terminal, has mpv = mpv -- "$@"

# Archives: first action lists, second action extracts.
ext 7z|ace|alz|arc|arj|bz|bz2|cab|cpio|deb|gz|jar|lha|lz|lzh|lzma|lzo|rar|rpm|rz|tar|tbz|tbz2|tgz|tlz|txz|xz|zip|zst, has atool = atool --list --each -- "$@" | ${PAGER:-less -R}
ext 7z|ace|alz|arc|arj|bz|bz2|cab|cpio|deb|gz|jar|lha|lz|lzh|lzma|lzo|rar|rpm|rz|tar|tbz|tbz2|tgz|tlz|txz|xz|zip|zst, has atool = atool --extract --each -- "$@"
ext zip, has unzip = unzip -l "$1" | ${PAGER:-less -R}
ext zip, has unzip = unzip -d "${1%.*}" -- "$1"
ext 7z, has 7z = 7z l -p -- "$1" | ${PAGER:-less -R}

# Scripts and executables. These are intentionally after text rules.
ext py, terminal = python -- "$1"
ext js, terminal = node -- "$1"
ext sh|bash|zsh, terminal = sh -- "$1"
mime application/x-executable, terminal = "$1"

# Desktop fallback and trash integration.
label open, has xdg-open, X, flag f = xdg-open -- "$@"
label editor = nvim -- "$@"
label pager = ${PAGER:-less -R} -- "$@"
label trash, has trash-put = trash-put -- "$@"
label trash, has gio = gio trash -- "$@"
label trash = mkdir -p -- "${XDG_DATA_HOME:-$HOME/.local/share}/ranger-trash"; mv -- "$@" "${XDG_DATA_HOME:-$HOME/.local/share}/ranger-trash"
else = ask
