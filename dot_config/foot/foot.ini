# foot — быстрый/запасной терминал (стиль системы: FiraCode, Noctalia).
[main]
include=~/.config/foot/themes/noctalia

# Шрифт как в ghostty; 14pt = «4 нажатия +» от 12pt (шаг зума foot — 0.5pt).
font=FiraCode Nerd Font Mono:size=14
# Отступы от краёв.
pad=8x8
# Выделенное копируется в PRIMARY + CLIPBOARD.
selection-target=both

[cursor]
style=beam
blink=no

[scrollback]
lines=10000
multiplier=3.0