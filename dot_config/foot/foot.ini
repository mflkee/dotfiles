# foot — быстрый/запасной терминал (стиль системы: FiraCode, dpi-aware, Noctalia).
[main]
include=~/.config/foot/themes/noctalia

# Шрифт как в ghostty (FiraCode Nerd Font Mono), комфортный размер.
font=FiraCode Nerd Font Mono:size=12
# Немного воздушнее строки.
line-height=1.2
# Масштаб по фактическому DPI монитора (важно на HiDPI).
dpi-aware=yes
# Отступы от краёв — не впритык.
pad=8x8
# Выделенное копируется и в PRIMARY, и в CLIPBOARD (удобно на Wayland).
selection-target=both

[cursor]
style=beam
blink=no

[scrollback]
lines=10000
multiplier=3.0