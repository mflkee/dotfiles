# foot — быстрый/запасной терминал (стиль системы: FiraCode, Noctalia).
[main]
include=~/.config/foot/themes/noctalia

# Шрифт как в ghostty; размер в pt при стандартном DPI 96 (dpi-aware не включаем —
# на этом дисплее оно давало высоту строки 2px).
font=FiraCode Nerd Font Mono:size=12
# Отступы от краёв.
pad=8x8
# Выделенное копируется в PRIMARY + CLIPBOARD.
selection-target=both

[cursor]
style=beam
blink=no

[scrollback]
lines=10000
multiplier=3.0