# Default audio source selection for PipeWire/WirePlumber 0.5.
#
# IMPORTANT SYNTAX NOTE: this parser does NOT accept "--" line comments. It
# reads them as section headers and aborts the whole file with
# "invalid section name". Use "#" (as in every file shipped in
# wireplumber.conf.d). An earlier version of this file used "--" and was
# silently rejected on every single load, so none of its rules ever applied.
#
# Why this file exists
# --------------------
# WirePlumber picks the default source by highest "priority.session" (sources
# default to ~1600-2000). Out of the box the Focusrite Scarlett Solo 4th Gen
# "Input 1 Inst/Line" node won that race and became the system default mic.
# That preamp input carries no signal whatsoever (measured -91 dBFS, i.e.
# digital silence) because the Scarlett is only used here as a headphone
# DAC/amp (its Line1 output is the default sink).
#
# The symptom was extremely misleading: Zen Browser, agent websites and
# Discord recorded pure silence, which looks exactly like "the browser picked
# the wrong microphone" or "the mic is not detected". Nothing was ever pinned
# in the browser profile: permissions.sqlite held zero microphone entries and
# prefs.js had no media.cubeb.input_device_string. The browsers were
# faithfully following a broken system default.
#
# On microphone test pages there is a device dropdown, so manually choosing
# "USB PnP Audio Device Mono" (about -28 dBFS peak, a healthy signal) worked,
# which is why the problem looked site-specific instead of system-wide.
#
# What this config does
# ---------------------
# Rule 1 raises the USB PnP Audio Device Mono, the real working mic.
# Rule 2 pushes every Scarlett Solo input down to 0 so none of them can ever
# win the default race again.
#
# Both rules come in pairs, matching on node.name and on node.description.
# That is deliberate. The Scarlett's per-pin inputs are named
# "alsa_input.usb-Focusrite_...-00.HiFi__Mic1__source", but the card-level
# capture node ALSA hands us is named "alsa_input.hw_Gen_0", so a node.name
# pattern aimed at the pins silently misses it and that node keeps winning
# the race. Matching the description ("Scarlett Solo 4th Gen ...") catches
# every naming scheme the driver can produce. The USB side is matched by
# device prefix so the choice survives replugging the microphone into a
# different port, which changes the node serial suffix but not the
# "usb-0c76_USB_PnP_Audio_Device" part.
#
# The Scarlett's ALSA nodes churn (the card-level node and the Mic1/Mic2/Line2
# pins get destroyed and recreated, and PipeWire recycles their numeric IDs),
# so do not be surprised when a node id changes between two commands.
#
# IMPORTANT: a selection made with "wpctl set-default" is remembered in
# WirePlumber's state file (~/.local/state/wireplumber/default-nodes) and
# outranks every priority on all later starts. So priorities alone do not fix
# an already-broken machine. Clear the stored choice once with
#   wpctl clear-default 1     # 1 = Audio/Source, 0 = Audio/Sink
# and these rules take over from then on. Do that before "fixing" priorities
# and wondering why nothing changed.
#
# Do NOT clear index 0 (Audio/Sink) casually: the sink state file holds a
# fallback stack (Scarlett Line1 -> HDMI -> echo-cancel-sink) and dropping it
# can hand the default output to the muted HDMI device.
#
# Verify which source is default, and whether it carries signal:
#   wpctl status | sed -n '/Sources:/,/Filters:/p'
#   pactl get-default-source
#   ffmpeg -f pulse -i default -t 3 -af volumedetect -f null -
#
# To use a Scarlett input instead: wire the mic in, set gain and 48V on the
# hardware, confirm it carries signal with the volumedetect command above,
# then delete rules 2a/2b and raise the relevant Scarlett node in 1a/1b.
#
# See also dot_config/pipewire/pipewire-pulse.conf.d/echo-cancel.conf, which
# exposes "mic_clean" (WebRTC AEC + noise suppression) as an extra input.
#
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.usb-0c76_USB_PnP_Audio_Device.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 2100
        priority.session = 2100
      }
    }
  }
  {
    matches = [
      {
        node.description = "~USB PnP Audio Device.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 2100
        priority.session = 2100
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Focusrite_Scarlett_Solo_4th_Gen.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 0
        priority.session = 0
      }
    }
  }
  {
    matches = [
      {
        node.description = "~Scarlett Solo 4th Gen.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 0
        priority.session = 0
      }
    }
  }
]
