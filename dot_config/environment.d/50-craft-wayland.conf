FILMCRAFT_WAYLAND=1
LIGHTCRAFT_WAYLAND=1
DECKCRAFT_WAYLAND=1
SOUNDCRAFT_WAYLAND=1
CADCRAFT_WAYLAND=1
WORDCRAFT_WAYLAND=1
