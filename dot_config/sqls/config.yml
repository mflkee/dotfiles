---
# Конфиг SQL LSP (sqls), читаемый из ~/.config/sqls/config.yml.
# Все подключения указывают на Docker-стенд курса, не на локальный PostgreSQL.
version: 2
connections:
  - alias: course
    driver: postgresql
    dataSourceName: "host=127.0.0.1 port=15432 user=course password=course dbname=course sslmode=disable"
  - alias: course_m06
    driver: postgresql
    dataSourceName: "host=127.0.0.1 port=15432 user=course password=course dbname=course_m06 sslmode=disable"
  - alias: timescale
    driver: postgresql
    dataSourceName: "host=127.0.0.1 port=15433 user=course password=course dbname=course sslmode=disable"
  - alias: capstone
    driver: postgresql
    dataSourceName: "host=127.0.0.1 port=15442 user=course password=course dbname=capstone sslmode=disable"
