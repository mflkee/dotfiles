# Yazi theme configuration
# Inspired by popular themes like Catppuccin, Dracula, etc.

[filetype]
# Images - yellow
{ mime = "image/*", fg = "yellow" }
# Videos - magenta
{ mime = "{audio,video}/*", fg = "magenta" }
# Audio - magenta
{ mime = "audio/*", fg = "magenta" }
# Executables - green
{ is = "exec", fg = "green" }
# Directories - blue
{ url = "*/", fg = "blue" }
# Ordinary files - white
{ url = "*", fg = "white" }
# Empty files - cyan
{ mime = "inode/empty", fg = "cyan" }
# Symbolic links - cyan
{ is = "link", fg = "cyan" }
# Broken/orphaned links - red
{ is = "orphan", fg = "red" }
# Sockets - yellow
{ is = "sock", fg = "yellow" }
# Pipes - yellow
{ is = "fifo", fg = "yellow" }
# Block devices - yellow
{ is = "block", fg = "yellow" }
# Character devices - yellow
{ is = "char", fg = "yellow" }
# Sticky bit - magenta
{ is = "sticky", fg = "magenta" }

[header]
# Active pane header
active = { bg = "blue", fg = "black" }
# Inactive pane header
inactive = { bg = "gray", fg = "black" }

[border]
# Focused border
focused = { fg = "blue" }
# Unfocused border
unfocused = { fg = "gray" }

[title]
# Pane titles
foreground = "blue"

[statusbar]
# Status bar background
background = { bg = "black", fg = "gray" }
# Status bar left section
left = { bg = "black", fg = "white" }
# Status bar right section
right = { bg = "black", fg = "yellow" }

[keymap]
# Key mappings description
description = { fg = "gray" }
# Key mappings key
key = { fg = "yellow" }
# Key mappings label
label = { fg = "blue" }

[prompt]
# Input prompt
input = { fg = "yellow" }
# Input prompt cursor
cursor = { bg = "yellow", fg = "black" }

[progress]
# Progress bar
bar = { bg = "gray", fg = "blue" }
# Progress bar text
text = { fg = "blue" }

[task]
# Task pane
title = { fg = "blue" }
# Task pane border
border = { fg = "blue" }
# Task pane description
description = { fg = "white" }

[search]
# Search matches
matches = { bg = "blue", fg = "black" }
# Search counter
counter = { fg = "blue" }
# Search prompt
prompt = { fg = "yellow" }

[cloud]
# Cloud sync status
idle = { fg = "gray" }
# Cloud sync uploading
uploading = { fg = "yellow" }
# Cloud sync downloading
downloading = { fg = "green" }
# Cloud sync error
error = { fg = "red" }

